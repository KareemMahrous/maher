name: maher
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  equatable: 
  dartz:
  easy_localization: ^3.0.8
  ffmpeg_kit_flutter_new_audio:
  flutter_bloc:
  flutter_svg:
  get_it:
  google_sign_in: ^7.2.0
  msal_auth: ^3.5.3
  dio:
  skeletonizer:
  fluttertoast:
  shared_preferences:
  auto_route:
  formz:
  loader_overlay:
  flutter_foreground_task:
  flutter_native_splash: ^2.4.7
  path_provider:
  record:
  wakelock_plus:
  firebase_core:

dev_dependencies:
  auto_route_generator:
  build_runner:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/auth/
    - assets/splash/

flutter_native_splash:
  background_image: assets/splash/splash.png
  android_gravity: fill
  ios_content_mode: scaleAspectFill
  web: false
  android_12:
    color: "#1A417F"
    image: assets/splash/android12_logo.png
